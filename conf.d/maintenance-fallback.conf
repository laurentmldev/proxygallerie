# Maintenance page for a site whose container is stopped altogether.
#
# When a site's container stops, nginx-proxy drops its server block from
# the generated config, so the request falls through to nginx-proxy's
# catch-all server: a bare 503 over HTTP and a rejected TLS handshake
# over HTTPS (a browser error, not a page). These two servers catch
# those hostnames instead and show the maintenance page.
#
# They never get in the way of a running site: nginx always prefers an
# exact server_name (what nginx-proxy generates for each VIRTUAL_HOST)
# over a regex one like these, so they only answer for hostnames that
# currently have no server block of their own.

server {
    listen 80;
    server_name ~^[a-z0-9-]+(\.[a-z0-9-]+)+$;

    # Same behaviour as a live site: go to HTTPS when we hold its cert.
    if (-f /etc/nginx/certs/maintenance/$host/fullchain.pem) {
        return 301 https://$host$request_uri;
    }

    location / {
        return 503;
    }

    include /etc/nginx/snippets/maintenance.conf;
}

server {
    listen 443 ssl;
    server_name ~^[a-z0-9-]+(\.[a-z0-9-]+)+$;

    # Reuses the certificate acme-companion issued for the (now
    # stopped) site. Once the container is gone acme-companion removes
    # the <host>.crt/.key links, but the files stay in the certs volume;
    # the maintenance-certs service keeps a link to them per host in
    # certs/maintenance/ (see maintenance/link-certs.sh).
    #
    # Loaded per handshake, so a hostname without a cert just fails the
    # handshake, as before, without breaking nginx's config. The
    # server_name regex above (letters, digits, dashes, dots) is what
    # keeps the SNI name a safe path. Being loaded by nginx's worker
    # (user nginx) rather than its master (root), the key must be
    # readable by the nginx group: see FILES_GID / FILES_PERMS on
    # acme-companion in docker-compose.yml.
    ssl_certificate /etc/nginx/certs/maintenance/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/maintenance/$ssl_server_name/key.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 503;
    }

    include /etc/nginx/snippets/maintenance.conf;
}
