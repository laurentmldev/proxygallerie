# Shows the "site en maintenance / back soon" page instead of nginx's
# bare 502/503/504 whenever this host's backend can't answer (container
# crashed, restarting, still booting, timing out). Included from each
# vhost.d/<host> file and from conf.d/maintenance-fallback.conf.
#
# Only errors nginx itself produces are replaced: an error page the app
# sends on its own is passed through untouched (no proxy_intercept_errors).
# Always answered as 503 so search engines treat it as temporary.
error_page 502 503 504 =503 /__maintenance__/;

location ^~ /__maintenance__/ {
    internal;
    alias /usr/share/nginx/maintenance/;
    index index.html;
    # Fills in the <!--# echo var="host" --> line of the page.
    ssi on;
}
