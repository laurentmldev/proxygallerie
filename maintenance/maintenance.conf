# Shows the "site en maintenance / back soon" page instead of nginx's
# bare 502/503/504 whenever this host's backend can't answer (container
# crashed, restarting, still booting, timing out). Included from each
# vhost.d/<host> file and from conf.d/maintenance-fallback.conf.
#
# Covers both nginx's own 502/503/504 (backend unreachable or timing
# out) and the same codes sent by the backend itself, which is what a
# site gets when its own front container (an inner nginx, a gunicorn
# proxy...) is up but the app behind it is not. Any other status the
# app sends (404, 500...) is passed through untouched. Always answered
# as 503 so search engines treat it as temporary.
proxy_intercept_errors on;
error_page 502 503 504 =503 /__maintenance__/;

location ^~ /__maintenance__/ {
    internal;
    alias /usr/share/nginx/maintenance/;
    index index.html;
    # Fills in the <!--# echo var="host" --> line of the page.
    ssi on;
}
